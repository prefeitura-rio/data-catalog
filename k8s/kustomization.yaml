apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: base-chart
    repo: oci://ghcr.io/prefeitura-rio/charts
    version: 2.4.2
    releaseName: data-catalog
    skipTests: true
    valuesInline:
      replicaCount: 2

      image:
        repository: ghcr.io/prefeitura-rio/data-catalog
        tag: latest
        pullPolicy: Always

      service:
        type: ClusterIP
        port: 80
        containerPort: 8080

      istio:
        enabled: false

      autoscaling:
        enabled: false

      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"

      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

      podLabels:
        app: data-catalog
        component: web

      podSecurityContext:
        fsGroup: 101

      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user
        readOnlyRootFilesystem: true

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run

      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: data-catalog.iplan.dados.rio
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - data-catalog.iplan.dados.rio
            secretName: data-catalog-tls

# Keep the immutable Deployment selector, the Service selector, the Ingress name and the
# pull without credentials (public image) of the raw manifests, so Argo CD updates the
# existing resources in place instead of recreating them.
patches:
  - target:
      kind: Deployment
      name: data-catalog
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels
        value:
          app: data-catalog
          component: web
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Service
      name: data-catalog
    patch: |-
      - op: replace
        path: /spec/selector
        value:
          app: data-catalog
          component: web
  - target:
      kind: Ingress
      name: data-catalog
    patch: |-
      - op: replace
        path: /metadata/name
        value: data-catalog-ingress
