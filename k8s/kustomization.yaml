apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: base-chart
    repo: https://prefeitura-rio.github.io/charts
    version: 2.3.0
    releaseName: data-catalog
    namespace: data-catalog
    valuesInline:
      replicaCount: 2

      image:
        repository: ghcr.io/prefeitura-rio/data-catalog
        pullPolicy: IfNotPresent
        tag: "latest"

      imagePullSecrets:
        - name: ghcr-credentials

      service:
        type: ClusterIP
        port: 80
        containerPort: 8080

      istio:
        enabled: false

      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"

      healthCheck:
        path: /

      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

      autoscaling:
        enabled: false

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run

      podLabels:
        component: web

      podSecurityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      securityContext:
        runAsUser: 101
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

      podDisruptionBudget:
        enabled: true
        minAvailable: 1
